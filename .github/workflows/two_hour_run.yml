name: Two-Hour RSS Feed Update
on:
  schedule:
    # Every 30 minutes (at :00 and :30 of each hour)
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race to push the feed; a queued run waits for the one in progress.
concurrency:
  group: feed-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node 20 deprecation

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a hung page fetch can't hold a runner for GitHub's 6-hour default

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'   # 3.10 reached end of life Oct. 2026; runner images drop EOL versions
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run RSS feed generator
      # Exits nonzero (and leaves the last good feed in place) if the site feed is down, empty or the output won't parse.
      run: python ark_full_feed.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/full_feed.xml
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Update RSS feed - $(date -u '+%Y-%m-%d %H:%M UTC')"
        for i in 1 2 3; do
          git pull --rebase --quiet && git push && exit 0
          sleep $((i * 5))
        done
        exit 1
